<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VetBeings Admin</title>

<style>
body{font-family:Arial,sans-serif;background:#f5f7f5;margin:0;padding:20px}
.box{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:12px}
input{padding:11px;margin:5px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{padding:11px 14px;margin:4px;background:#08753f;color:#fff;border:0;border-radius:6px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px}
td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}
#loginBox{max-width:400px;margin:80px auto;background:#fff;padding:25px;border-radius:12px;text-align:center}
#loginBox input{width:95%}
#error{color:#c62828}
.form{display:flex;flex-wrap:wrap;gap:5px;margin-top:15px}
.form input{flex:1;min-width:150px}
.product-img{width:55px;height:55px;object-fit:cover;border-radius:7px;border:1px solid #ddd}
#preview{width:140px;height:140px;object-fit:cover;border-radius:10px;border:1px solid #ddd;display:none;margin:12px 5px}
#uploadStatus{font-weight:bold;margin:8px 5px}
@media(max-width:700px){
 body{padding:8px}
 .box{padding:10px}
 table{font-size:11px}
 td,th{padding:6px}
}
</style>
</head>

<body>

<div id="loginBox">
<h2>🔐 VetBeings Admin Login</h2>
<p>Enter admin password to continue.</p>
<input id="password" type="password" placeholder="Admin Password">
<br>
<button onclick="login()">Login</button>
<p id="error"></p>
</div>

<div class="box" id="dashboard" style="display:none">

<h1>VetBeings Admin Dashboard</h1>
<p>Manage product photos, details, stock and orders.</p>

<button onclick="logout()">Logout</button>

<hr>

<h2>Add / Edit Product</h2>

<input id="id" type="hidden">

<div class="form">
<input id="name" placeholder="Product name">
<input id="category" placeholder="Category">
<input id="price" type="number" placeholder="Price">
<input id="stock" type="number" placeholder="Stock">
</div>

<h3>Product Photo</h3>

<input
 id="imageFile"
 type="file"
 accept="image/jpeg,image/png,image/webp"
 onchange="showPreview()"
>

<br>

<img id="preview" alt="Product Preview">

<p id="uploadStatus"></p>

<button id="saveBtn" onclick="save()">Save Product</button>
<button onclick="clearForm()">Clear</button>

<h2>Products</h2>

<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Photo</th>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>
<th>Action</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>
</div>

<h2>Orders</h2>
<div id="orders"></div>

</div>

<script>

let P=[];
let adminPassword="";
let oldImage="";

function authHeaders(extra={}){
 return {
   ...extra,
   "Authorization":"Bearer "+adminPassword
 };
}

async function login(){

 const pass=document.getElementById("password").value;

 if(!pass){
   error.innerText="Please enter password.";
   return;
 }

 try{

   const r=await fetch("/api/admin/orders",{
     headers:{
       "Authorization":"Bearer "+pass
     }
   });

   if(!r.ok){
     error.innerText="❌ Wrong password";
     return;
   }

   adminPassword=pass;

   loginBox.style.display="none";
   dashboard.style.display="block";
   error.innerText="";

   await load();

 }catch(e){
   error.innerText="Server connection error.";
 }
}

async function load(){

 try{

   P=await fetch("/api/products").then(r=>r.json());

   body.innerHTML=P.map(x=>`
   <tr>

   <td>
   ${
     x.image
     ? `<img class="product-img" src="${x.image}" alt="">`
     : "No photo"
   }
   </td>

   <td>${x.name || ""}</td>
   <td>${x.category || ""}</td>
   <td>₹${x.price || 0}</td>
   <td>${x.stock || 0}</td>

   <td>
   <button onclick="editProduct(${x.id})">Edit</button>
   <button onclick="delProduct(${x.id})">Delete</button>
   </td>

   </tr>
   `).join("");

   const r=await fetch("/api/admin/orders",{
     headers:authHeaders()
   });

   if(!r.ok){
     logout();
     return;
   }

   const o=await r.json();

   orders.innerHTML=o.map(x=>`
   <p>
   <b>${x.id}</b> —
   ${x.status} —
   ${x.payment} —
   ₹${x.total || 0} —
   ${x.customer?.name || ""}
   </p>
   `).join("") || "No orders yet";

 }catch(e){
   console.error(e);
 }
}

function showPreview(){

 const file=imageFile.files[0];

 if(!file) return;

 if(file.size > 5*1024*1024){
   alert("Photo maximum 5 MB honi chahiye.");
   imageFile.value="";
   return;
 }

 preview.src=URL.createObjectURL(file);
 preview.style.display="block";
}

function editProduct(i){

 const x=P.find(v=>v.id==i);

 if(!x) return;

 id.value=x.id;
 name.value=x.name || "";
 category.value=x.category || "";
 price.value=x.price || "";
 stock.value=x.stock || "";

 oldImage=x.image || "";

 imageFile.value="";

 if(oldImage){
   preview.src=oldImage;
   preview.style.display="block";
 }else{
   preview.style.display="none";
 }

 window.scrollTo({
   top:0,
   behavior:"smooth"
 });
}

function clearForm(){

 id.value="";
 name.value="";
 category.value="";
 price.value="";
 stock.value="";
 imageFile.value="";
 oldImage="";
 preview.removeAttribute("src");
 preview.style.display="none";
 uploadStatus.innerText="";
}

async function save(){

 const productName=name.value.trim();

 if(!productName){
   alert("Product name enter karo.");
   return;
 }

 const fd=new FormData();

 if(id.value){
   fd.append("id",id.value);
 }

 fd.append("name",name.value.trim());
 fd.append("category",category.value.trim());
 fd.append("price",price.value || 0);
 fd.append("stock",stock.value || 0);

 if(imageFile.files[0]){
   fd.append("image",imageFile.files[0]);
 }

 saveBtn.disabled=true;
 uploadStatus.innerText="⏳ Saving product / uploading photo...";

 try{

   const r=await fetch("/api/admin/products",{
     method:"POST",
     headers:{
       "Authorization":"Bearer "+adminPassword
     },
     body:fd
   });

   const result=await r.json();

   if(!r.ok){
     throw new Error(result.error || "Unable to save");
   }

   uploadStatus.innerText="✅ Product saved successfully";

   clearForm();

   await load();

 }catch(e){

   uploadStatus.innerText="❌ "+e.message;

 }finally{

   saveBtn.disabled=false;
 }
}

async function delProduct(i){

 if(!confirm("Delete product?")) return;

 try{

   const r=await fetch("/api/admin/products/"+i,{
     method:"DELETE",
     headers:authHeaders()
   });

   const result=await r.json();

   if(!r.ok){
     throw new Error(result.error || "Delete failed");
   }

   await load();

 }catch(e){
   alert(e.message);
 }
}

function logout(){

 adminPassword="";

 dashboard.style.display="none";
 loginBox.style.display="block";

 password.value="";
 clearForm();
}

password.addEventListener("keydown",function(e){
 if(e.key==="Enter") login();
});

</script>

</body>
</html>
