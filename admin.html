<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VetBeings Admin</title><style>body{font-family:Arial;background:#f5f7f5;margin:0;padding:25px}.box{max-width:1100px;margin:auto;background:#fff;padding:22px;border-radius:12px}input{padding:10px;margin:4px;border:1px solid #ccc;border-radius:5px}button{padding:10px;background:#08753f;color:white;border:0;border-radius:5px}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}@media(max-width:700px){table{font-size:12px}.box{padding:10px}}</style></head><body><div class="box"><h1>VetBeings Admin Dashboard</h1><p>Add/edit/delete products, price and stock. Demo admin has no login yet — add authentication before public deployment.</p><input id="id" type="hidden"><input id="name" placeholder="Product name"><input id="category" placeholder="Category"><input id="price" type="number" placeholder="Price"><input id="stock" type="number" placeholder="Stock"><button onclick="save()">Save Product</button><h2>Products</h2><table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead><tbody id="body"></tbody></table><h2>Orders</h2><div id="orders"></div></div><script>let P=[];async function load(){P=await fetch("/api/products").then(r=>r.json());body.innerHTML=P.map(x=>`<tr><td>${x.name}</td><td>${x.category}</td><td>₹${x.price}</td><td>${x.stock}</td><td><button onclick="edit(${x.id})">Edit</button> <button onclick="del(${x.id})">Delete</button></td></tr>`).join("");let o=await fetch("/api/admin/orders").then(r=>r.json());orders.innerHTML=o.map(x=>`<p><b>${x.id}</b> — ${x.status} — ${x.payment} — ₹${x.total||0} — ${x.customer?.name||""}</p>`).join("")||"No orders yet"}function edit(i){let x=P.find(v=>v.id==i);id.value=x.id;name.value=x.name;category.value=x.category;price.value=x.price;stock.value=x.stock}async function save(){await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id.value?Number(id.value):undefined,name:name.value,category:category.value,price:Number(price.value),stock:Number(stock.value)})});location.reload()}async function del(i){if(confirm("Delete product?")){await fetch("/api/admin/products/"+i,{method:"DELETE"});location.reload()}}load()</script></body></html>
