<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VetBeings Admin</title>

<style>
body{font-family:Arial,sans-serif;background:#f5f7f5;margin:0;padding:20px}
.box{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:12px}
input{padding:11px;margin:5px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{padding:11px 14px;margin:4px;background:#08753f;color:#fff;border:0;border-radius:6px;cursor:pointer}
button:disabled{opacity:.6}
table{width:100%;border-collapse:collapse;margin-top:20px}
td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}
#loginBox{max-width:400px;margin:80px auto;background:#fff;padding:25px;border-radius:12px;text-align:center}
#loginBox input{width:95%}
#error{color:#c62828}
.form{display:flex;flex-wrap:wrap;gap:5px;margin-top:15px}
.form input{flex:1;min-width:150px}
.product-img{width:55px;height:55px;object-fit:cover;border-radius:7px;border:1px solid #ddd}
#preview{width:140px;height:140px;object-fit:cover;border-radius:10px;border:1px solid #ddd;display:none;margin:12px 5px}
#uploadStatus{font-weight:bold;margin:8px 5px}
@media(max-width:700px){
body{padding:8px}
.box{padding:10px}
table{font-size:11px}
td,th{padding:6px}
}
</style>
</head>

<body>

<div id="loginBox">
<h2>🔐 VetBeings Admin Login</h2>
<p>Enter admin password to continue.</p>

<input id="password" type="password" placeholder="Admin Password">

<br>

<button id="loginBtn" type="button">Login</button>

<p id="error"></p>
</div>


<div class="box" id="dashboard" style="display:none">

<h1>VetBeings Admin Dashboard</h1>

<p>Manage product photos, details, stock and orders.</p>

<button id="logoutBtn" type="button">Logout</button>

<hr>

<h2>Add / Edit Product</h2>

<input id="productId" type="hidden">

<div class="form">

<input id="productName" type="text" placeholder="Product name">

<input id="productCategory" type="text" placeholder="Category">

<input id="productPrice" type="number" placeholder="Price">

<input id="productStock" type="number" placeholder="Stock">

</div>

<h3>Product Photo</h3>

<input
id="imageFile"
type="file"
accept="image/jpeg,image/png,image/webp"
>

<br>

<img id="preview" alt="Product Preview">

<p id="uploadStatus"></p>

<button id="saveBtn" type="button">Save Product</button>

<button id="clearBtn" type="button">Clear</button>


<h2>Products</h2>

<div style="overflow-x:auto">

<table>

<thead>
<tr>
<th>Photo</th>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>
<th>Action</th>
</tr>
</thead>

<tbody id="productBody"></tbody>

</table>

</div>


<h2>Orders</h2>

<div id="ordersBox">No orders yet</div>

</div>


<script>

let products = [];
let adminPassword = "";

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const passwordInput = document.getElementById("password");
const errorBox = document.getElementById("error");

const productId = document.getElementById("productId");
const productName = document.getElementById("productName");
const productCategory = document.getElementById("productCategory");
const productPrice = document.getElementById("productPrice");
const productStock = document.getElementById("productStock");

const imageFile = document.getElementById("imageFile");
const preview = document.getElementById("preview");
const uploadStatus = document.getElementById("uploadStatus");

const saveBtn = document.getElementById("saveBtn");
const productBody = document.getElementById("productBody");
const ordersBox = document.getElementById("ordersBox");


async function login(){

  const pass = passwordInput.value.trim();

  if(!pass){
    errorBox.textContent = "Please enter password.";
    return;
  }

  errorBox.textContent = "Checking...";

  try{

    const response = await fetch("/api/admin/orders",{
      headers:{
        "Authorization":"Bearer " + pass
      }
    });

    if(!response.ok){
      errorBox.textContent = "❌ Wrong password";
      return;
    }

    adminPassword = pass;

    errorBox.textContent = "";

    loginBox.style.display = "none";
    dashboard.style.display = "block";

    await loadData();

  }catch(err){

    errorBox.textContent = "Server connection error.";

  }
}


async function loadData(){

  try{

    const productResponse = await fetch("/api/products");

    products = await productResponse.json();

    renderProducts();


    const orderResponse = await fetch("/api/admin/orders",{
      headers:{
        "Authorization":"Bearer " + adminPassword
      }
    });

    if(!orderResponse.ok){
      logout();
      return;
    }

    const orders = await orderResponse.json();

    if(!orders.length){

      ordersBox.textContent = "No orders yet";

    }else{

      ordersBox.innerHTML = orders.map(order => `
        <p>
          <b>${escapeHtml(order.id)}</b> —
          ${escapeHtml(order.status)} —
          ${escapeHtml(order.payment)} —
          ₹${Number(order.total || 0)} —
          ${escapeHtml(order.customer?.name || "")}
        </p>
      `).join("");

    }

  }catch(err){

    console.error(err);

  }
}


function renderProducts(){

  productBody.innerHTML = products.map(product => {

    const imageHtml = product.image
      ? `<img class="product-img" src="${escapeAttribute(product.image)}" alt="Product">`
      : "No photo";

    return `
      <tr>

        <td>${imageHtml}</td>

        <td>${escapeHtml(product.name || "")}</td>

        <td>${escapeHtml(product.category || "")}</td>

        <td>₹${Number(product.price || 0)}</td>

        <td>${Number(product.stock || 0)}</td>

        <td>
          <button type="button" onclick="editProduct('${product.id}')">Edit</button>
          <button type="button" onclick="deleteProduct('${product.id}')">Delete</button>
        </td>

      </tr>
    `;

  }).join("");

}


function showPreview(){

  const file = imageFile.files[0];

  if(!file){
    return;
  }

  if(file.size > 5 * 1024 * 1024){

    alert("Photo maximum 5 MB honi chahiye.");

    imageFile.value = "";

    preview.removeAttribute("src");
    preview.style.display = "none";

    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

}


function editProduct(id){

  const product = products.find(
    item => String(item.id) === String(id)
  );

  if(!product){
    return;
  }

  productId.value = product.id;

  productName.value = product.name || "";
  productCategory.value = product.category || "";
  productPrice.value = product.price || "";
  productStock.value = product.stock || "";

  imageFile.value = "";

  if(product.image){

    preview.src = product.image;
    preview.style.display = "block";

  }else{

    preview.removeAttribute("src");
    preview.style.display = "none";

  }

  uploadStatus.textContent = "Editing existing product";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function clearForm(){

  productId.value = "";

  productName.value = "";
  productCategory.value = "";
  productPrice.value = "";
  productStock.value = "";

  imageFile.value = "";

  preview.removeAttribute("src");
  preview.style.display = "none";

  uploadStatus.textContent = "";

}


async function saveProduct(){

  const nameValue = productName.value.trim();

  if(!nameValue){

    alert("Product name enter karo.");

    productName.focus();

    return;
  }

  const formData = new FormData();

  if(productId.value){
    formData.append("id",productId.value);
  }

  formData.append("name",nameValue);
  formData.append("category",productCategory.value.trim());
  formData.append("price",productPrice.value || "0");
  formData.append("stock",productStock.value || "0");

  if(imageFile.files && imageFile.files[0]){
    formData.append("image",imageFile.files[0],"product-image");
  }

  saveBtn.disabled = true;

  uploadStatus.textContent =
    "⏳ Product save ho raha hai. Photo upload ho rahi hai...";

  try{

    const response = await fetch("/api/admin/products",{
      method:"POST",

      headers:{
        "Authorization":"Bearer " + adminPassword
      },

      body:formData
    });


    let result;

    try{
      result = await response.json();
    }catch{
      result = {};
    }


    if(!response.ok){

      throw new Error(
        result.error ||
        "Product save nahi hua. Server error: " + response.status
      );

    }


    clearForm();

    uploadStatus.textContent = "✅ Product saved successfully";

    await loadData();


  }catch(err){

    console.error(err);

    uploadStatus.textContent = "❌ " + err.message;

  }finally{

    saveBtn.disabled = false;

  }

}


async function deleteProduct(id){

  if(!confirm("Delete product?")){
    return;
  }

  try{

    const response = await fetch(
      "/api/admin/products/" + encodeURIComponent(id),
      {
        method:"DELETE",

        headers:{
          "Authorization":"Bearer " + adminPassword
        }
      }
    );


    let result;

    try{
      result = await response.json();
    }catch{
      result = {};
    }


    if(!response.ok){

      throw new Error(
        result.error || "Product delete nahi hua."
      );

    }

    await loadData();


  }catch(err){

    alert(err.message);

  }

}


function logout(){

  adminPassword = "";

  dashboard.style.display = "none";
  loginBox.style.display = "block";

  passwordInput.value = "";

  clearForm();

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return escapeHtml(value);

}


document
.getElementById("loginBtn")
.addEventListener("click",login);

document
.getElementById("logoutBtn")
.addEventListener("click",logout);

document
.getElementById("clearBtn")
.addEventListener("click",clearForm);

saveBtn.addEventListener("click",saveProduct);

imageFile.addEventListener("change",showPreview);

passwordInput.addEventListener("keydown",function(event){

  if(event.key === "Enter"){
    login();
  }

});

</script>

</body>
</html>
